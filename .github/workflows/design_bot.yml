name: Design Bot
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - run: playwright install --with-deps chromium
      - name: Визуальный аудит вёрстки и типографики
        run: |
          echo "### Design Bot: визуальный аудит" >> $GITHUB_STEP_SUMMARY
          python scripts/design_bot.py | tee /tmp/design.log || { tail -20 /tmp/design.log >> $GITHUB_STEP_SUMMARY; exit 1; }
          tail -12 /tmp/design.log >> $GITHUB_STEP_SUMMARY
      - name: Коммит новых бейзлайнов
        run: |
          if [ -n "$(git status --porcelain visual-baseline/)" ]; then
            git config user.name "design-bot"
            git config user.email "design-bot@users.noreply.github.com"
            git add visual-baseline/
            git commit -m "design: baseline $(date -u +%F)"
            git push
          else
            echo "бейзлайны актуальны"
          fi
